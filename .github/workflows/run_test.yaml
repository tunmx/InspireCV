name: Build and test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspirecv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.library }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            library: object
            object_libs: "ON"
            shared_libs: "OFF"
            examples: "ON"
          - os: ubuntu-latest
            library: static
            object_libs: "OFF"
            shared_libs: "OFF"
            examples: "OFF"
          - os: ubuntu-latest
            library: shared
            object_libs: "OFF"
            shared_libs: "ON"
            examples: "OFF"
          - os: macos-latest
            library: object
            object_libs: "ON"
            shared_libs: "OFF"
            examples: "ON"
          - os: macos-latest
            library: shared
            object_libs: "OFF"
            shared_libs: "ON"
            examples: "OFF"
          - os: windows-2022
            library: object
            object_libs: "ON"
            shared_libs: "OFF"
            examples: "ON"
          - os: windows-2022
            library: static
            object_libs: "OFF"
            shared_libs: "OFF"
            examples: "OFF"
          - os: windows-2022
            library: shared
            object_libs: "OFF"
            shared_libs: "ON"
            examples: "OFF"

    steps:
      - uses: actions/checkout@v4

      - name: Show Linux toolchain and CPU
        if: runner.os == 'Linux'
        run: |
          c++ --version
          lscpu

      - name: Configure
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DINSPIRECV_BUILD_OBJECT_LIBS=${{ matrix.object_libs }} \
            -DINSPIRECV_BUILD_SHARED_LIBS=${{ matrix.shared_libs }} \
            -DINSPIRECV_BUILD_TESTS=ON \
            -DINSPIRECV_BUILD_EXAMPLES=${{ matrix.examples }} \
            -DINSPIRECV_INSTALL=ON

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Test
        if: runner.os != 'Windows'
        run: ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Prepare Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/windows/setup_environment.ps1

      - name: Build, test, and install Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INSPIRECV_LIBRARY_TYPE: ${{ matrix.library }}
          INSPIRECV_EXAMPLES: ${{ matrix.examples }}
        run: |
          $buildOptions = @{
            BuildDirectory = 'build'
            Configuration = $env:BUILD_TYPE
            LibraryType = $env:INSPIRECV_LIBRARY_TYPE
            RunTests = $true
            Examples = $env:INSPIRECV_EXAMPLES -eq 'ON'
          }
          ./command/build_windows.ps1 @buildOptions

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.os }}-${{ matrix.library }}
          path: |
            build/Testing/Temporary/
            build/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Install
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --install build --config "$BUILD_TYPE" --prefix "$PWD/build/install"

      - name: Upload install tree
        uses: actions/upload-artifact@v4
        with:
          name: inspirecv-${{ matrix.os }}-${{ matrix.library }}
          path: build/install
          if-no-files-found: error
          retention-days: 7

  sanitizers:
    name: ubuntu-latest / ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build-sanitized \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DINSPIRECV_BUILD_OBJECT_LIBS=OFF \
            -DINSPIRECV_BUILD_SHARED_LIBS=OFF \
            -DINSPIRECV_BUILD_TESTS=ON \
            -DINSPIRECV_INSTALL=OFF

      - name: Build
        run: cmake --build build-sanitized --parallel

      - name: Test
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          INSPIRECV_IMAGES_DIR: ${{ github.workspace }}/images
          INSPIRECV_GT_DIR: ${{ github.workspace }}/images/task_gt
        # Sanitizer instrumentation changes exact floating-point bit patterns.
        # The normal matrix covers that contract in uninstrumented Release jobs.
        run: |
          set -o pipefail
          ./build-sanitized/inspirecv_tests \
            '~[benchmark]~[bench]~[numeric-bit-contract]' \
            2>&1 | tee build-sanitized/test-output.log

      - name: Upload sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-sanitizers
          path: |
            build-sanitized/test-output.log
            build-sanitized/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 14
